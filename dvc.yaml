stages:
  network_security_pipeline:
    desc: >
      This is the End-to-End Machine Learning Pipeline for the Network Security project.
      When executed, it sequentially runs:
      1. Data Ingestion: Connects to MongoDB, retrieves phrasingData, and handles missing/NA values.
      2. Data Validation: Ensures the data schema perfectly aligns with requirements.
      3. Data Transformation: Drops the target column and applies KNN Imputation / scaling via pipeline.
      4. Model Training: Performs hyperparameter tuning and evaluates algorithms (Random Forest, AdaBoost, etc).
      5. Tracking: Tracks all experiments natively to MLFlow.
    
    cmd: python main.py
    
    # Dependencies: If ANY of these files change, DVC knows the pipeline needs to be re-run
    deps:
      - main.py
      - networksecurity/components/data_ingestion.py
      - networksecurity/components/data_validation.py
      - networksecurity/components/data_transformation.py
      - networksecurity/components/model_trainer.py
      - networksecurity/utils/ml_utils/model/estimator.py

    # Parameters: DVC tracks these specific hyperparameter toggles from params.yaml
    params:
      - ModelTrainer.DecisionTree.criterion
      - ModelTrainer.RandomForest.n_estimators
      - ModelTrainer.RandomForest.criterion
      - ModelTrainer.GradientBoosting.learning_rate
      - ModelTrainer.GradientBoosting.n_estimators
      - ModelTrainer.AdaBoost.learning_rate
      - ModelTrainer.AdaBoost.n_estimators

    # Outputs: Artifacts generated by the pipeline that DVC will aggressively version control
    outs:
      # Stores the raw data, transformed arrays, and evaluation metrics mapping
      - artifacts/
      # Stores the serialized preprocessor.pkl and model.pkl
      - final_model/
